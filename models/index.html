<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <title>3D Models | Fusion 360</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #e2e8f0;
    }

    .page {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 1rem;
      background: #0a0a0a;
      border-bottom: 1px solid #222;
    }

    .toolbar h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .toolbar a {
      color: #93c5fd;
      text-decoration: none;
      font-size: 0.875rem;
    }

    .toolbar a:hover {
      text-decoration: underline;
    }

    .viewer-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="toolbar">
      <h1>Fusion 360 · Bed frame</h1>
      <a href="/">← Back to resume</a>
    </header>
    <div class="viewer-wrap">
      <model-viewer
        src="Bed_Frame.stl.glb"
        alt="Bed frame 3D model (Fusion 360 export)"
        auto-rotate
        camera-controls
        shadow-intensity="1">
      </model-viewer>
    </div>
  </div>
</body>
</html>
